[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-core"
version = "0.1.0"
description = "AgentShield-X Core Data Contracts and Cryptographic Utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
agentshield = "shield_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
