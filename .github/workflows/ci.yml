name: AgentShield-X CI

on:
  push:
    branches: [main, master, "phase*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio flake8
          pip install -e packages/shield_core
          pip install -e packages/shield_sdk_py
          pip install -e packages/eventbus
          pip install -e detectors/rules
          pip install -e detectors/pii
          pip install -e detectors/honey
          pip install -e services/decision
          pip install -e services/gateway

      - name: Code Quality & Lint Gate
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 packages/shield_core services/control_api --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Deterministic Unit Tests (pytest)
        run: |
          python -m pytest tests/unit/ -v

      - name: Verify Phase 1 Acceptance Gate
        run: |
          python demo/attack_library/runner.py
