name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in AgentShield-X
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide detailed information to help us reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Code snippet, CLI command, or configuration that triggers the issue.
      placeholder: |
        1. Run 'agentshield scan ...'
        2. Call tool with payload '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, AgentShield version.
      value: |
        - OS: Windows / Linux / macOS
        - Python: 3.12
        - AgentShield-X Version: 1.0.0
    validations:
      required: true

