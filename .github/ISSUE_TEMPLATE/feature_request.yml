name: 💡 Feature Request
description: Propose a new feature, detector rule, connector, or enhancement for AgentShield-X
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We welcome proposals for new agentic security features, connectors, or benchmark datasets!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or attack vector does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the architecture, API, or CLI behavior you would like to see.
    validations:
      required: true
  - type: checkboxes
    id: contributor_interest
    attributes:
      label: Would you like to contribute?
      options:
        - label: I am willing to submit a Pull Request to implement this feature.

