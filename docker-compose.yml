version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: agentshield-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  decision-service:
    build:
      context: .
      dockerfile: services/decision/Dockerfile
    container_name: agentshield-decision
    environment:
      - PORT=8001
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: agentshield-gateway
    environment:
      - PORT=8000
      - DECISION_SERVICE_URL=http://decision-service:8001
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - decision-service

  demo-runner:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: agentshield-demo-runner
    environment:
      - SHIELD_ENDPOINT=http://gateway:8000
      - SHIELD_API_KEY=shield_test_key_phase1
    depends_on:
      - gateway
